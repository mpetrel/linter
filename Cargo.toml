[package]
name = "linter"
version = "0.1.0"
edition = "2024"
description = "A small Typora-like live-preview Markdown editor built with Rust and Slint"

[dependencies]
slint = { version = "1.19", features = ["unstable-winit-030", "raw-window-handle-06"] }
pulldown-cmark = { version = "0.13", default-features = false }
rfd = "0.16"

[build-dependencies]
embed-resource = "3"
slint-build = "1.19"

[profile.release]
lto = "thin"
