[package]
name = "linter"
version = "0.1.0"
edition = "2024"
description = "A small Typora-like live-preview Markdown editor built with Rust and Slint"

[dependencies]
slint = { version = "1.19", features = ["unstable-winit-030", "raw-window-handle-06"] }
pulldown-cmark = { version = "0.13", default-features = false }
rfd = "0.16"
# Image decoding (see src/images.rs). Slint already uses the image crate for
# PNG and JPEG (zune-jpeg); these add the other formats.
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "bmp", "ico", "tiff", "tga", "pnm", "qoi"] }
# Decodes large JPEGs at 1/2, 1/4 or 1/8 size, which is much faster than a full decode.
jpeg-decoder = { version = "0.3", default-features = false }
# libwebp: about 4x faster than the pure Rust WebP decoder, and it can scale while decoding.
libwebp-sys = "0.14"
# SIMD resizing, chosen at run time for the CPU.
fast_image_resize = "6"
# Unpacks .svgz on a worker thread. Slint's SVG support already uses it.
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
# Remote images. native-tls uses the system's TLS and certificates (SChannel on
# Windows, OpenSSL on Linux); win-system-proxy reads the Windows proxy setting.
ureq = { version = "3", default-features = false, features = ["native-tls-no-default", "win-system-proxy"] }

[build-dependencies]
embed-resource = "3"
slint-build = "1.19"

[profile.release]
lto = "thin"

# Unoptimized image decoding is 10 to 50 times slower; this keeps debug builds
# and tests usable with large images.
[profile.dev.package]
image.opt-level = 3
png.opt-level = 3
fdeflate.opt-level = 3
miniz_oxide.opt-level = 3
zune-jpeg.opt-level = 3
jpeg-decoder.opt-level = 3
libwebp-sys.opt-level = 3
fast_image_resize.opt-level = 3
gif.opt-level = 3
weezl.opt-level = 3
